/remote_node:
  ros__parameters:
    arduino:
      port: "/dev/ttyACM1"
      baudrate: 9600

/lidar_node:
  ros__parameters:
    lidar:
      min_range: 0.5    # minimum range (meters)
      max_range: 2.0    # maximum range (meters)
      min_point: 5      # minimum number of valid points
      min_angle: 345    # minimum angle (degrees)
      max_angle: 15     # maximum angle (degrees)