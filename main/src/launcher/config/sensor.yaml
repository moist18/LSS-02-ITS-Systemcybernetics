/remote_node:
  ros__parameters:
    arduino:
      port: "/dev/ttyACM1"
      baudrate: 9600

/state_init:
  ros__parameters:
    mavros_init_timeout: 60

/rplidar_node:
  ros__parameters:
    channel_type: 'serial'
    serial_port: '/dev/ttyUSB0'
    serial_baudrate: 256000
    frame_id: 'laser'
    inverted: false
    angle_compensate: true

/lidar_node:
  ros__parameters:
    lidar:
      min_range: 0.2    # minimum range (meters)
      max_range: 2.2    # maximum range (meters)
      min_point: 5      # minimum number of valid points
      min_angle: 345    # minimum angle (degrees)
      max_angle: 15     # maximum angle (degrees)