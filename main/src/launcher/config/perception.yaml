/vision_node:
  ros__parameters:
    model_path: '/home/ubuntu/ASV-2025/main/src/perception/perception/models/lesgo-v8n_x416_rknn_model'
    camera_device: 0            # Camera device ID (0=/dev/video0, 1=/dev/video1)
    vision:
      detection:
        confidence: 0.65        # Detection confidence threshold (0.0-1.0)
        iou_threshold: 0.5      # IoU threshold for NMS (0.0-1.0)
        image_size: 416         # Input image size for YOLO model
      rc:
        min_value: [1000, 1300]
        mid_value: 1500
        max_value: [2000, 1700]

/underwater_node:
  ros__parameters:
    camera_device: 1            # Camera device ID (0=/dev/video0, 1=/dev/video1)

/recorder_node:
  ros__parameters:
    video_dir: '/home/ubuntu/ASV-2025/recordings'   # Directory for recorded videos
    fps: 20                                         # Recording frame rate
    resolution: [640, 480]                          # Camera resolution [width, height]
    codec: 'MJPG'                                   # Video codec (MJPG, XVID, mp4v)
    camera_device: 0                                # Camera device ID (0=/dev/video0, 1=/dev/video1)