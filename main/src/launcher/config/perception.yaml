/vision_node:
  ros__parameters:
    model_path: '/home/ubuntu/ASV-2025/main/src/perception/perception/models/lesgo-v8n_x416_rknn_model'
    
    config:
      camera_device: 0          # Camera device ID (0=/dev/video0, 2=/dev/video2)
      width: 640                # Camera resolution width
      height: 480               # Camera resolution height
      fps: 30                   # Camera frame rate

    vision:
      detection:
        confidence: 0.5        # Detection confidence threshold (0.0-1.0)
        iou_threshold: 0.5      # IoU threshold for NMS (0.0-1.0)
        image_size: 416         # Input image size for YOLO model

      rc:
        min_value: [1000, 1300]
        mid_value: 1500
        max_value: [2000, 1700]

/underwater_node:
  ros__parameters:
    config:
      camera_device: 2          # Camera device ID (0=/dev/video0, 2=/dev/video2)
      width: 640                # Camera resolution width
      height: 480               # Camera resolution height
      fps: 30                   # Camera frame rate

/recorder_node:
  ros__parameters:
    video_dir: '/home/ubuntu/ASV-2025/recordings'   # Directory for recorded videos

    config:
      camera_device: 0                              # Camera device ID (0=/dev/video0, 2=/dev/video2)   
      resolution: [640, 480]                        # Camera resolution [width, height]
      fps: 20                                       # Camera frame rate
      codec: 'MJPG'                                 # Video codec (MJPG, XVID, mp4v)