/vision_node:
  ros__parameters:
    # YOLO Detection Configuration
    detection:
      confidence: 0.65        # Detection confidence threshold (0.0-1.0)
      iou_threshold: 0.5      # IoU threshold for NMS (0.0-1.0)  
      image_size: 640         # Input image size for YOLO model
    
    # RC Control Configuration
    rc:
      throttle: [2000, 1700]
      min_value: [1000, 1300]
      mid_value: 1500
      max_value: [2000, 1700]
    
    # PID Controller Configuration
    pid:
      yaw:
        kp: 0.8
        ki: 0.08
        kd: 0.00005
        min_output: -1.0
        max_output: 1.0

/vision_nav:
  ros__parameters:
    rc:
      throttle: [2000, 1700]
      min_value: [1000, 1300]
      mid_value: 1500
      max_value: [2000, 1700]
    
    pid:
      yaw:
        kp: 0.8
        ki: 0.08
        kd: 0.00005
        min_output: -1.0
        max_output: 1.0
    
    timer:
      docking: 3.0