          altitude: 0.0

/compass_navigation:
  ros__parameters:
    compass:
      heading:
        A:
          count: 3
          "1": 160.0
          "2": 85.0
          "3": 345.0
        B:
          count: 3
          "1": 325.0
          "2": 60.0
          "3": 155.0

      rc:
        min_value: 1200
        mid_value: 1500
        max_value: 1800

      tolerance: 20.0

/vision_navigation:
  ros__parameters:
    config:
      use_lidar: false

    vision:
      rc:
        throttle: [2000, 1700]
        min_value: [1000, 1100]
        mid_value: 1500
        max_value: [2000, 1900]
        steering_bias: [-70, -45]  # Bias ke kiri untuk kompensasi hull berat kanan (negative = kiri, positive = kanan)

      pid:
        yaw:
          kp: 1.0
          ki: 0.1
          kd: 0.00001
          min_output: -1.0
          max_output: 1.0

      timer:
        docking: 3.0
