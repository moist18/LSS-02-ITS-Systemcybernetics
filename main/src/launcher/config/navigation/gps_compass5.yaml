        waypoint_2:
          latitude: 0.0
          longitude: 0.0
          altitude: 0.0
        waypoint_3:
          latitude: 0.0
          longitude: 0.0
          altitude: 0.0
        waypoint_4:
          latitude: 0.0
          longitude: 0.0
          altitude: 0.0

      waypoints_B:
        count: 5
        waypoint_0:
          latitude: 0.0
          longitude: 0.0
          altitude: 0.0
        waypoint_1:
          latitude: 0.0
          longitude: 0.0
          altitude: 0.0
        waypoint_2:
